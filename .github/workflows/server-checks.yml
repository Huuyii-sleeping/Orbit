name: Server checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @orbit/service-auth test
      - run: pnpm --filter agent-bff test
      - run: pnpm --filter skill-registry test
      - run: pnpm --filter agent-cli test:workflow
      - run: pnpm --filter agent-cli test:daemon
      - run: pnpm --filter agent-cli exec vitest run test/unit/entrypoints/server.test.ts test/unit/entrypoints/daemon.test.ts test/unit/service-api test/unit/mastra/storage test/unit/mastra/adapters/agent-runtime-adapter.test.ts test/smoke/nest-host-compatibility.test.ts --no-cache
      - run: pnpm check:workflow-boundaries
      - run: pnpm check:structure
